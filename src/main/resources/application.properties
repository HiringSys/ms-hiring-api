spring.application.name=HiringSys
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE:10MB}

app.supabase.url=${SUPABASE_URL}
app.supabase.secret-key=${SUPABASE_SECRET_KEY}
app.supabase.bucket=${SUPABASE_BUCKET}
app.files.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}

app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.rh.username=${RH_USERNAME}
app.security.rh.password=${RH_PASSWORD}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

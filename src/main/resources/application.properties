spring.application.name=HiringSys
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE:10MB}

app.supabase.url=${SUPABASE_URL}
app.supabase.secret-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=${SUPABASE_BUCKET}
app.files.max-size-bytes=${FILE_MAX_SIZE_BYTES:10485760}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:HiringSys}

server.port=${PORT:8080}
server.address=0.0.0.0
